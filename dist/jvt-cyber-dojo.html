<title>JVT Cyber Dojo</title>
<style>
/* ======================================================================
   JVT Cyber Dojo — stylesheet
   Thema's via data-theme op <html>. Donker is standaard.
   ====================================================================== */

:root {
  --bg: #0b1020;
  --bg-2: #0e1428;
  --surface: #141c33;
  --surface-2: #1b2544;
  --surface-3: #243156;
  --border: #2a3657;
  --text: #e8ecf8;
  --muted: #9aa6c8;
  --faint: #6b779c;
  --accent: #39d98a;
  --accent-2: #2bb673;
  --accent-soft: rgba(57, 217, 138, 0.14);
  --accent-ink: #052016;
  --link: #6db5ff;
  --good: #39d98a;
  --bad: #ff6b6b;
  --warn: #ffbe4d;
  --info: #6db5ff;
  --danger: #ff6b6b;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --radius: 14px;
  --radius-sm: 9px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --maxw: 1180px;
  color-scheme: dark;
}

/* Lichte tokens — als één set, hergebruikt door zowel de expliciete keuze
   (data-theme="light") als de systeemvoorkeur (prefers-color-scheme: light,
   zolang de gebruiker niet expliciet donker koos). */
:root[data-theme="light"] {
  --bg: #eef1f8;
  --bg-2: #e6eaf4;
  --surface: #ffffff;
  --surface-2: #f3f5fb;
  --surface-3: #e7ebf5;
  --border: #d4dae8;
  --text: #16203a;
  --muted: #566288;
  --faint: #8591b2;
  --accent: #10b06a;
  --accent-2: #0b8f55;
  --accent-soft: rgba(16, 176, 106, 0.12);
  --accent-ink: #ffffff;
  --link: #1766c7;
  --good: #10b06a;
  --bad: #d64545;
  --warn: #b7791f;
  --info: #1766c7;
  --danger: #d64545;
  --shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
  color-scheme: light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f8;
    --bg-2: #e6eaf4;
    --surface: #ffffff;
    --surface-2: #f3f5fb;
    --surface-3: #e7ebf5;
    --border: #d4dae8;
    --text: #16203a;
    --muted: #566288;
    --faint: #8591b2;
    --accent: #10b06a;
    --accent-2: #0b8f55;
    --accent-soft: rgba(16, 176, 106, 0.12);
    --accent-ink: #ffffff;
    --link: #1766c7;
    --good: #10b06a;
    --bad: #d64545;
    --warn: #b7791f;
    --info: #1766c7;
    --danger: #d64545;
    --shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--sans);
  background:
    radial-gradient(1100px 600px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 500px at -10% 0%, rgba(109, 181, 255, 0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--link); }

h1, h2, h3, h4 { line-height: 1.25; margin: 1.4em 0 0.5em; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.15rem; }

code {
  font-family: var(--mono);
  font-size: 0.9em;
  background: var(--surface-2);
  padding: 0.12em 0.4em;
  border-radius: 6px;
  border: 1px solid var(--border);
}
pre {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 0.86rem;
  line-height: 1.5;
}
pre code { background: none; border: none; padding: 0; font-size: inherit; }
kbd {
  font-family: var(--mono);
  font-size: 0.82em;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0.1em 0.45em;
}

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 18px; }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  backdrop-filter: blur(10px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom: 1px solid var(--border);
}
.topbar .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.2px; cursor: pointer; background: none; border: 0; color: var(--text); font-size: 1.05rem; padding: 0; }
.brand .logo {
  width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center; font-size: 1.1rem;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  color: var(--accent-ink); box-shadow: var(--shadow);
}
.brand small { color: var(--muted); font-weight: 600; font-size: 0.72rem; display: block; margin-top: -3px; }
.spacer { flex: 1; }

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 12px; min-width: 150px;
}
.search input { background: none; border: 0; color: var(--text); outline: none; width: 100%; font-size: 0.9rem; }
.search input::placeholder { color: var(--faint); }

.iconbtn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 1rem;
  display: grid; place-items: center; transition: transform .1s, border-color .15s;
}
.iconbtn:hover { border-color: var(--accent); transform: translateY(-1px); }

.xp-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 12px 5px 8px; font-weight: 700; font-size: 0.85rem;
  cursor: pointer;
}
.xp-pill .lvl {
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  color: var(--accent-ink); border-radius: 999px; padding: 2px 9px; font-size: 0.78rem;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 15px; font-size: 0.92rem; font-weight: 600; cursor: pointer;
  transition: transform .08s, border-color .15s, background .15s;
}
.btn:hover { transform: translateY(-1px); border-color: var(--accent); }
.btn.primary { background: linear-gradient(145deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ---------- Hero ---------- */
.hero { padding: 46px 0 10px; }
.hero h1 { font-size: 2.4rem; margin: 0 0 10px; }
.hero h1 .g { background: linear-gradient(110deg, var(--accent), var(--link)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { color: var(--muted); font-size: 1.1rem; max-width: 640px; margin: 0 0 20px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }

.stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; min-width: 120px;
}
.stat .n { font-size: 1.6rem; font-weight: 800; }
.stat .l { color: var(--muted); font-size: 0.82rem; }

/* ---------- Path sections ---------- */
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 38px 0 4px; flex-wrap: wrap; }
.section-head .num {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 0.9rem; flex: none;
}
.section-head h2 { margin: 0; }
.section-head .meta { color: var(--muted); font-size: 0.85rem; }
.section-desc { color: var(--muted); margin: 2px 0 14px 42px; max-width: 760px; }
.pathbar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 0 0 20px 42px; max-width: 760px; }
.pathbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s; }

/* ---------- Room cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; cursor: pointer; position: relative; overflow: hidden;
  transition: transform .12s, border-color .15s, box-shadow .15s;
  display: flex; flex-direction: column; gap: 10px;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.card .top { display: flex; align-items: flex-start; gap: 12px; }
.card .ic {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 1.4rem;
  background: var(--surface-2); border: 1px solid var(--border);
}
.card h3 { margin: 0; font-size: 1.05rem; }
.card .sum { color: var(--muted); font-size: 0.9rem; flex: 1; }
.card .tags { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.tag {
  font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
}
.tag.diff-Makkelijk { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
.tag.diff-Gemiddeld { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
.tag.diff-Moeilijk { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.card .progress { height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.card .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s; }
.card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }
.card .done-badge {
  position: absolute; top: 12px; right: 12px; font-size: 0.72rem; font-weight: 800;
  color: var(--accent-ink); background: var(--accent); padding: 3px 9px; border-radius: 999px;
}
.card.locked { opacity: 0.62; }
.card.locked:hover { transform: none; border-color: var(--border); box-shadow: none; }
.card .lock { position: absolute; top: 12px; right: 12px; color: var(--faint); }

/* ---------- Room view ---------- */
.roomview { padding: 26px 0 80px; }
.crumbs { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
.crumbs a { cursor: pointer; }
.room-hero { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.room-hero .ic { width: 64px; height: 64px; border-radius: 16px; font-size: 2rem; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); flex: none; }
.room-hero h1 { margin: 0 0 6px; }
.room-hero .sum { color: var(--muted); max-width: 640px; }
.room-hero .tags { margin-top: 10px; }

.objectives {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 20px; margin: 22px 0;
}
.objectives h3 { margin: 0 0 8px; font-size: 1rem; }
.objectives ul { margin: 0; padding-left: 20px; }
.objectives li { margin: 4px 0; }

.roomlayout { display: grid; grid-template-columns: 240px 1fr; gap: 26px; margin-top: 10px; align-items: start; }
.tasknav { position: sticky; top: 76px; }
.tasknav ol { list-style: none; margin: 0; padding: 0; counter-reset: t; }
.tasknav li {
  padding: 9px 12px; border-radius: 9px; cursor: pointer; color: var(--muted);
  font-size: 0.88rem; display: flex; gap: 9px; align-items: center; border: 1px solid transparent;
}
.tasknav li:hover { background: var(--surface); }
.tasknav li.active { background: var(--surface); border-color: var(--border); color: var(--text); font-weight: 600; }
.tasknav li .chk {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex: none;
  display: grid; place-items: center; font-size: 0.65rem;
}
.tasknav li.complete .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.task { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 26px; margin-bottom: 22px; scroll-margin-top: 76px; }
.task > h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }
.task .body > :first-child { margin-top: 0; }
.task .body img { max-width: 100%; }
.task .body table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 0.9rem; }
.task .body th, .task .body td { border: 1px solid var(--border); padding: 8px 11px; text-align: left; }
.task .body th { background: var(--surface-2); }
.task .body details { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; margin: 12px 0; }
.task .body summary { cursor: pointer; font-weight: 600; }
.task .body figure.diagram { margin: 18px 0; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: var(--text); }
.task .body figure.diagram svg { max-width: 100%; height: auto; }
.task .body figcaption { color: var(--muted); font-size: 0.84rem; margin-top: 10px; }

.callout { border-radius: var(--radius-sm); padding: 12px 16px; margin: 14px 0; border: 1px solid var(--border); border-left-width: 4px; background: var(--surface-2); }
.callout.tip { border-left-color: var(--good); }
.callout.info { border-left-color: var(--info); }
.callout.warn { border-left-color: var(--warn); }
.callout.danger { border-left-color: var(--danger); }
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }

/* ---------- Questions ---------- */
.questions { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 18px; }
.questions h3 { margin: 0 0 12px; font-size: 1rem; }
.q { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 12px; }
.q.correct { border-color: color-mix(in srgb, var(--good) 55%, var(--border)); }
.q .qtext { font-weight: 600; margin-bottom: 10px; }
.q .qtext .badge-xp { float: right; font-size: 0.72rem; color: var(--accent); font-weight: 700; }
.ans-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ans-row input[type="text"] {
  flex: 1; min-width: 180px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 12px; color: var(--text); font-family: var(--mono); font-size: 0.9rem; outline: none;
}
.ans-row input[type="text"]:focus { border-color: var(--accent); }
.ans-row input.ok { border-color: var(--good); }
.ans-row input.no { border-color: var(--bad); }
.mc { display: grid; gap: 8px; }
.mc button {
  text-align: left; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 9px; padding: 10px 13px; cursor: pointer; font-size: 0.92rem; transition: border-color .12s;
}
.mc button:hover { border-color: var(--accent); }
.mc button.chosen.ok { border-color: var(--good); background: var(--accent-soft); }
.mc button.chosen.no { border-color: var(--bad); }
.mc button.reveal-ok { border-color: var(--good); }
.mc button:disabled { cursor: default; }
.q .feedback { margin-top: 9px; font-size: 0.88rem; display: none; }
.q .feedback.show { display: block; }
.q .feedback.ok { color: var(--good); }
.q .feedback.no { color: var(--bad); }
.q .explain { margin-top: 8px; font-size: 0.87rem; color: var(--muted); background: var(--bg-2); border-radius: 8px; padding: 8px 12px; border: 1px solid var(--border); display: none; }
.q .explain.show { display: block; }
.q .hintline { margin-top: 8px; font-size: 0.85rem; color: var(--warn); display: none; }
.q .hintline.show { display: block; }
.q .lnk { background: none; border: 0; color: var(--link); cursor: pointer; font-size: 0.83rem; padding: 0; }

.room-foot { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; flex-wrap: wrap; }

/* ---------- Lab shell ---------- */
.lab { margin: 18px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-2); }
.lab-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.lab-head .dot { width: 11px; height: 11px; border-radius: 50%; }
.lab-head .dot.r { background: #ff5f56; } .lab-head .dot.y { background: #ffbd2e; } .lab-head .dot.g { background: #27c93f; }
.lab-head .title { margin-left: 6px; color: var(--muted); font-weight: 600; }
.lab-head .title b { color: var(--text); }
.lab-body { padding: 0; }

/* terminal */
.term { font-family: var(--mono); font-size: 0.85rem; background: #0a0e1c; color: #d6e2ff; padding: 14px; height: 340px; overflow-y: auto; }
:root[data-theme="light"] .term { background: #0f1526; }
.term .line { white-space: pre-wrap; word-break: break-word; }
.term .prompt { color: var(--accent); }
.term .inrow { display: flex; }
.term .inrow input { flex: 1; background: none; border: 0; color: #d6e2ff; font-family: var(--mono); font-size: 0.85rem; outline: none; }
.term .err { color: #ff8a8a; }
.term .muted { color: #7f8db5; }

/* generic lab panels */
.lab-pad { padding: 16px; }
.lab-pad textarea, .lab-pad input[type="text"], .lab-pad input[type="password"], .lab-pad select {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 9px 11px; font-family: var(--mono); font-size: 0.88rem; outline: none;
}
.lab-pad textarea:focus, .lab-pad input:focus, .lab-pad select:focus { border-color: var(--accent); }
.lab-pad label { font-size: 0.82rem; color: var(--muted); display: block; margin: 10px 0 4px; }
.lab-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lab-out { background: var(--bg-2); border: 1px dashed var(--border); border-radius: 8px; padding: 11px 13px; font-family: var(--mono); font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; min-height: 40px; }
.chip-row { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0; }
.chip { font-size: 0.78rem; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 8px 0; }
.meter > i { display: block; height: 100%; transition: width .3s, background .3s; }

/* phishing */
.mail { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.mail .hdr { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
.mail .hdr .row { display: flex; gap: 8px; margin: 2px 0; }
.mail .hdr .k { color: var(--faint); width: 72px; flex: none; }
.mail .body { padding: 15px; font-size: 0.92rem; }
.flagable { cursor: pointer; border-bottom: 2px dotted transparent; transition: background .1s; border-radius: 3px; padding: 0 1px; }
.flagable:hover { background: var(--accent-soft); }
.flagable.flagged { background: color-mix(in srgb, var(--bad) 22%, transparent); border-bottom-color: var(--bad); }
.mail a.flagable { color: var(--link); }
.verdict-row { display: flex; gap: 10px; margin-top: 12px; }
.found-note { font-size: 0.82rem; color: var(--muted); margin-top: 8px; }

/* logs */
.logview { font-family: var(--mono); font-size: 0.8rem; background: #0a0e1c; color: #c9d6f5; max-height: 320px; overflow-y: auto; padding: 10px; border-radius: 8px; }
:root[data-theme="light"] .logview { background: #0f1526; color: #d6e2ff; }
.logview .ln { display: flex; gap: 10px; }
.logview .ln .n { color: #566288; width: 34px; text-align: right; flex: none; user-select: none; }
.logview .hl { background: color-mix(in srgb, var(--warn) 35%, transparent); color: #fff; border-radius: 3px; }

/* http */
.http-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kv-row { display: flex; gap: 8px; margin: 6px 0; }
.kv-row input { flex: 1; }
.resp { font-family: var(--mono); font-size: 0.82rem; }
.resp .status-200 { color: var(--good); } .resp .status-3 { color: var(--info); } .resp .status-4, .resp .status-5 { color: var(--bad); }

/* sqli */
.sqlform { max-width: 420px; }
.sqlquery { background: #0a0e1c; color: #9ef5c8; padding: 10px 12px; border-radius: 8px; font-family: var(--mono); font-size: 0.82rem; margin: 10px 0; word-break: break-all; }
:root[data-theme="light"] .sqlquery { background: #0f1526; }

/* toggle */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }
.switch input { display: none; }
.switch .track { width: 40px; height: 22px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + .track { background: var(--accent-soft); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--accent); }

/* ---------- Toast / modal ---------- */
.toast-wrap { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 220px; animation: pop .3s; }
.toast .t { font-weight: 700; }
.toast .s { color: var(--muted); font-size: 0.85rem; }
@keyframes pop { from { transform: translateY(12px) scale(.96); opacity: 0; } }

.modal-back { position: fixed; inset: 0; background: rgba(4, 8, 20, 0.6); backdrop-filter: blur(3px); z-index: 80; display: grid; place-items: center; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 520px; width: 100%; padding: 24px; box-shadow: var(--shadow); max-height: 86vh; overflow-y: auto; }
.modal h2 { margin-top: 0; }
.modal .close { float: right; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 10px; }
.badge-item { text-align: center; padding: 12px 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.badge-item.locked { opacity: 0.4; filter: grayscale(1); }
.badge-item .bi { font-size: 1.8rem; }
.badge-item .bn { font-size: 0.78rem; font-weight: 700; margin-top: 4px; }
.badge-item .bd { font-size: 0.68rem; color: var(--muted); }

/* glossary */
.glossary dl { margin: 0; }
.glossary dt { font-weight: 700; margin-top: 12px; }
.glossary dd { margin: 2px 0 0; color: var(--muted); }

/* footer */
.sitefoot { border-top: 1px solid var(--border); margin-top: 50px; padding: 26px 0; color: var(--muted); font-size: 0.85rem; }
.sitefoot .wrap { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* search results */
.searchres { position: absolute; top: 54px; right: 18px; left: 18px; max-width: var(--maxw); margin: 0 auto; z-index: 60; }
.searchres .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.searchres .item { padding: 11px 15px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.searchres .item:last-child { border-bottom: 0; }
.searchres .item:hover { background: var(--surface-2); }
.searchres .item .ic { font-size: 1.2rem; }
.searchres .item .t { font-weight: 600; }
.searchres .item .s { color: var(--muted); font-size: 0.8rem; }
.searchres .empty { padding: 16px; color: var(--muted); }

.hide { display: none !important; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .roomlayout { grid-template-columns: 1fr; }
  .tasknav { position: static; margin-bottom: 10px; }
  .tasknav ol { display: flex; gap: 6px; overflow-x: auto; }
  .tasknav li { white-space: nowrap; }
  .lab-grid2, .http-cols { grid-template-columns: 1fr; }
  .hero h1 { font-size: 1.9rem; }
  .search { min-width: 0; }
  .brand small { display: none; }
}
@media (max-width: 560px) {
  .search { display: none; }
  .hero { padding: 30px 0 6px; }
}

</style>

<header id="topbar" class="topbar"></header>
<main id="app"></main>

<script>
/* ======================================================================
   JVT Cyber Dojo — core engine
   Geen build, geen dependencies. Werkt via file:// en GitHub Pages.
   ====================================================================== */
(function () {
  'use strict';

  // ---- Globale namespace -------------------------------------------------
  const CS = window.CS = window.CS || {};
  const ROOMS = [];
  CS.registerRoom = (room) => { ROOMS.push(room); };
  CS.labs = CS.labs || {};          // labrenderers registreren zich hier
  CS.registerLab = (type, fn) => { CS.labs[type] = fn; };

  // ---- Leerpaden ---------------------------------------------------------
  const PATHS = [
    { id: 'fundamenten',   title: 'Fundamenten',            icon: '🧱', desc: 'De basis die alles draagt: wat security is, hoe netwerken, het web, Linux en Windows werken. Begin hier.' },
    { id: 'security-kern', title: 'Security-kern',          icon: '🔐', desc: 'Cryptografie, wachtwoorden & authenticatie en de menselijke factor — social engineering en phishing.' },
    { id: 'offensief',     title: 'Offensief (red team)',   icon: '⚔️', desc: 'Denken als een aanvaller: de OWASP Top 10, verkenning, en webkwetsbaarheden zelf uitbuiten in een veilig lab.' },
    { id: 'defensief',     title: 'Defensief (blue team)',  icon: '🛡️', desc: 'Aanvallen detecteren in logs, reageren op incidenten (NIST) en systemen thuis en op het werk weerbaar maken.' },
    { id: 'eindopdracht',  title: 'Eindopdracht',           icon: '🏁', desc: 'Breng alles samen in een afsluitende mini-CTF. Bewijs aan jezelf wat je kunt.' },
  ];

  // ---- Utilities ---------------------------------------------------------
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const el = (tag, attrs = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v === false || v === null || v === undefined) { /* booleaanse attributen: niet zetten als uit */ }
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, v);
    }
    (Array.isArray(kids) ? kids : [kids]).forEach((c) => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });
    return n;
  };
  const norm = (s) => String(s == null ? '' : s).trim().replace(/\s+/g, ' ');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  CS.util = { $, $$, el, norm, esc };

  // ---- Voortgang (localStorage) -----------------------------------------
  const LS_KEY = 'jvt-cyber-dojo-v1';
  let STATE = loadState();
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
    return {};
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) { /* privémodus e.d. */ }
  }
  // STATE vorm: { answered: { "roomId::t::q": true }, xp: 0, badges: {id:true}, seenIntro: true, name: "" }
  STATE.answered = STATE.answered || {};
  STATE.xp = STATE.xp || 0;
  STATE.badges = STATE.badges || {};

  const qKey = (roomId, ti, qi) => `${roomId}::${ti}::${qi}`;
  const isAnswered = (roomId, ti, qi) => !!STATE.answered[qKey(roomId, ti, qi)];

  function roomQuestionCount(room) {
    return (room.tasks || []).reduce((n, t) => n + (t.questions ? t.questions.length : 0), 0);
  }
  function roomAnsweredCount(room) {
    let n = 0;
    (room.tasks || []).forEach((t, ti) => (t.questions || []).forEach((q, qi) => { if (isAnswered(room.id, ti, qi)) n++; }));
    return n;
  }
  function roomDone(room) {
    const tot = roomQuestionCount(room);
    return tot > 0 && roomAnsweredCount(room) >= tot;
  }
  function roomProgress(room) {
    const tot = roomQuestionCount(room);
    return tot ? roomAnsweredCount(room) / tot : 0;
  }

  // ---- Levels & XP -------------------------------------------------------
  function levelFor(xp) {
    // oplopende drempels; level n vereist 50*n*(n+1)/... houden we simpel:
    let lvl = 1, need = 100, acc = 0;
    while (xp >= acc + need) { acc += need; lvl++; need = Math.round(need * 1.35); }
    return { lvl, into: xp - acc, need, floor: acc };
  }
  function addXP(amount, reason) {
    const before = levelFor(STATE.xp).lvl;
    STATE.xp += amount;
    const after = levelFor(STATE.xp).lvl;
    saveState();
    renderXP();
    if (after > before) toast('⭐ Level ' + after + '!', 'Je bent nu level ' + after + '. Doorgaan zo!');
  }

  // ---- Badges ------------------------------------------------------------
  const BADGES = [
    { id: 'first-blood', icon: '🩸', name: 'Eerste bloed', desc: 'Je eerste vraag goed', test: () => Object.keys(STATE.answered).length >= 1 },
    { id: 'fundamenten', icon: '🧱', name: 'Fundamentalist', desc: 'Alle Fundamenten-rooms af', test: () => pathDone('fundamenten') },
    { id: 'crypto',      icon: '🔐', name: 'Cryptograaf', desc: 'Alle Security-kern-rooms af', test: () => pathDone('security-kern') },
    { id: 'redteam',     icon: '⚔️', name: 'Red teamer', desc: 'Alle Offensief-rooms af', test: () => pathDone('offensief') },
    { id: 'blueteam',    icon: '🛡️', name: 'Blue teamer', desc: 'Alle Defensief-rooms af', test: () => pathDone('defensief') },
    { id: 'hacker10',    icon: '💡', name: 'Doorzetter', desc: '10 rooms afgerond', test: () => ROOMS.filter(roomDone).length >= 10 },
    { id: 'flaghunter',  icon: '🚩', name: 'Vlaggenjager', desc: '15 vlaggen gevonden', test: () => (STATE.flags || 0) >= 15 },
    { id: 'capstone',    icon: '🏆', name: 'Dojo-meester', desc: 'De eindopdracht voltooid', test: () => pathDone('eindopdracht') },
  ];
  function pathDone(pathId) {
    const rs = ROOMS.filter((r) => r.path === pathId);
    return rs.length > 0 && rs.every(roomDone);
  }
  function checkBadges() {
    BADGES.forEach((b) => {
      if (!STATE.badges[b.id] && b.test()) {
        STATE.badges[b.id] = true; saveState();
        toast('🏅 Badge: ' + b.name, b.desc);
      }
    });
  }

  // ---- Toasts ------------------------------------------------------------
  let toastWrap;
  function toast(title, sub) {
    if (!toastWrap) { toastWrap = el('div', { class: 'toast-wrap' }); document.body.append(toastWrap); }
    const t = el('div', { class: 'toast' }, [el('div', { class: 't', text: title }), sub ? el('div', { class: 's', text: sub }) : null]);
    toastWrap.append(t);
    setTimeout(() => { t.style.transition = 'opacity .4s, transform .4s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 400); }, 3200);
  }
  CS.toast = toast;

  // ---- Thema -------------------------------------------------------------
  function initTheme() {
    const saved = localStorage.getItem('jvt-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('jvt-theme', next);
    $('#themeBtn').textContent = next === 'light' ? '🌙' : '☀️';
  }

  // =======================================================================
  //  RENDER: topbar
  // =======================================================================
  function renderTopbar() {
    const bar = $('#topbar');
    bar.innerHTML = '';
    const wrap = el('div', { class: 'wrap' });
    const brand = el('button', { class: 'brand', onclick: () => go('#/') }, [
      el('span', { class: 'logo', text: '◈' }),
      el('span', {}, [document.createTextNode('JVT Cyber Dojo'), el('small', { text: 'Leer cybersecurity, stap voor stap' })]),
    ]);
    const search = el('div', { class: 'search' }, [
      el('span', { text: '🔎' }),
      el('input', { type: 'text', placeholder: 'Zoek in alle rooms…', id: 'searchInput', oninput: onSearch, onkeydown: (e) => { if (e.key === 'Escape') { e.target.value = ''; onSearch(); } } }),
    ]);
    const themeBtn = el('button', { class: 'iconbtn', id: 'themeBtn', title: 'Thema wisselen', onclick: toggleTheme, text: document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️' });
    const badgeBtn = el('button', { class: 'iconbtn', title: 'Badges', onclick: showBadges, text: '🏅' });
    const xp = el('button', { class: 'xp-pill', id: 'xpPill', title: 'Jouw voortgang', onclick: showProfile });
    wrap.append(brand, el('span', { class: 'spacer' }), search, themeBtn, badgeBtn, xp);
    bar.append(wrap);
    renderXP();
  }
  function renderXP() {
    const pill = $('#xpPill'); if (!pill) return;
    const L = levelFor(STATE.xp);
    pill.innerHTML = '';
    pill.append(el('span', { class: 'lvl', text: 'Lv ' + L.lvl }), el('span', { text: STATE.xp + ' XP' }));
  }

  // =======================================================================
  //  RENDER: home
  // =======================================================================
  function renderHome() {
    const root = $('#app');
    root.innerHTML = '';
    const totalRooms = ROOMS.length;
    const doneRooms = ROOMS.filter(roomDone).length;
    const totalQ = ROOMS.reduce((n, r) => n + roomQuestionCount(r), 0);
    const doneQ = ROOMS.reduce((n, r) => n + roomAnsweredCount(r), 0);

    const hero = el('section', { class: 'hero wrap' }, [
      el('h1', { html: 'Word stap voor stap <span class="g">cyber­security-vaardig</span>.' }),
      el('p', { class: 'lead', text: 'Een doelgericht leerportaal: korte uitleg, veel oefenen in echte browser-labs, en vragen met vlaggen om te vinden. Helemaal in het Nederlands, van de basis tot je eerste hacks en verdedigingen.' }),
      el('div', { class: 'hero-actions' }, [
        el('button', { class: 'btn primary', text: continueTarget() ? '▶ Ga verder waar je was' : '▶ Begin bij het begin', onclick: () => go(continueTarget() || firstRoomHash()) }),
        el('button', { class: 'btn ghost', text: '🏅 Bekijk badges', onclick: showBadges }),
      ]),
      el('div', { class: 'stat-row' }, [
        stat(doneRooms + '/' + totalRooms, 'rooms voltooid'),
        stat(doneQ + '/' + totalQ, 'vragen beantwoord'),
        stat('Lv ' + levelFor(STATE.xp).lvl, STATE.xp + ' XP'),
        stat(Object.keys(STATE.badges).length + '/' + BADGES.length, 'badges'),
      ]),
    ]);
    root.append(hero);

    const main = el('section', { class: 'wrap' });
    PATHS.forEach((p, i) => {
      const rooms = ROOMS.filter((r) => r.path === p.id).sort((a, b) => a.order - b.order);
      if (!rooms.length) return;
      const done = rooms.filter(roomDone).length;
      main.append(el('div', { class: 'section-head' }, [
        el('span', { class: 'num', text: String(i + 1) }),
        el('h2', { text: p.icon + ' ' + p.title }),
        el('span', { class: 'meta', text: done + '/' + rooms.length + ' af · ' + rooms.reduce((n, r) => n + r.minutes, 0) + ' min' }),
      ]));
      main.append(el('p', { class: 'section-desc', text: p.desc }));
      main.append(el('div', { class: 'pathbar' }, el('i', { style: 'width:' + Math.round((done / rooms.length) * 100) + '%' })));
      const grid = el('div', { class: 'grid' });
      rooms.forEach((r, idx) => grid.append(roomCard(r, rooms, idx)));
      main.append(grid);
    });
    root.append(main);
    renderFooter(root);
    checkBadges();
  }
  function stat(n, l) { return el('div', { class: 'stat' }, [el('div', { class: 'n', text: n }), el('div', { class: 'l', text: l })]); }

  function roomCard(room, siblings, idx) {
    const prog = roomProgress(room);
    const done = roomDone(room);
    // slot: een room is "locked" tot de vorige in hetzelfde pad af is (zachte gate, alleen visueel/optioneel)
    const locked = idx > 0 && !roomDone(siblings[idx - 1]) && prog === 0;
    const card = el('div', { class: 'card' + (locked ? ' locked' : ''), onclick: () => { if (!locked) go('#/room/' + room.id); else toast('🔒 Nog op slot', 'Rond eerst "' + siblings[idx - 1].title + '" af.'); } });
    card.append(el('div', { class: 'top' }, [
      el('div', { class: 'ic', text: room.icon }),
      el('div', {}, [el('h3', { text: room.title }), el('div', { class: 'tags' }, [
        el('span', { class: 'tag diff-' + room.difficulty, text: room.difficulty }),
        el('span', { class: 'tag', text: '⏱ ' + room.minutes + ' min' }),
        el('span', { class: 'tag', text: '❓ ' + roomQuestionCount(room) }),
      ])]),
    ]));
    card.append(el('div', { class: 'sum', text: room.summary }));
    card.append(el('div', { class: 'progress' }, el('i', { style: 'width:' + Math.round(prog * 100) + '%' })));
    card.append(el('div', { class: 'foot' }, [
      el('span', { text: roomAnsweredCount(room) + '/' + roomQuestionCount(room) + ' vragen' }),
      el('span', { text: done ? '✓ voltooid' : (prog > 0 ? Math.round(prog * 100) + '%' : 'start →') }),
    ]));
    if (done) card.append(el('div', { class: 'done-badge', text: '✓ KLAAR' }));
    else if (locked) card.append(el('div', { class: 'lock', text: '🔒' }));
    return card;
  }

  function firstRoomHash() {
    const all = orderedRooms();
    return all.length ? '#/room/' + all[0].id : '#/';
  }
  function orderedRooms() {
    const out = [];
    PATHS.forEach((p) => ROOMS.filter((r) => r.path === p.id).sort((a, b) => a.order - b.order).forEach((r) => out.push(r)));
    return out;
  }
  function continueTarget() {
    const all = orderedRooms();
    const next = all.find((r) => !roomDone(r) && roomProgress(r) > 0) || all.find((r) => !roomDone(r));
    return next ? '#/room/' + next.id : null;
  }

  // =======================================================================
  //  RENDER: room
  // =======================================================================
  function renderRoom(roomId) {
    const room = ROOMS.find((r) => r.id === roomId);
    const root = $('#app');
    root.innerHTML = '';
    if (!room) { root.append(el('div', { class: 'wrap', html: '<p>Room niet gevonden. <a href="#/">Terug naar overzicht</a></p>' })); return; }

    const view = el('section', { class: 'roomview wrap' });
    view.append(el('div', { class: 'crumbs' }, [
      el('a', { text: '🏠 Home', onclick: () => go('#/') }),
      document.createTextNode('  ›  ' + (PATHS.find((p) => p.id === room.path) || {}).title + '  ›  '),
      el('strong', { text: room.title }),
    ]));

    view.append(el('div', { class: 'room-hero' }, [
      el('div', { class: 'ic', text: room.icon }),
      el('div', {}, [
        el('h1', { text: room.title }),
        el('div', { class: 'sum', text: room.summary }),
        el('div', { class: 'tags' }, [
          el('span', { class: 'tag diff-' + room.difficulty, text: room.difficulty }),
          el('span', { class: 'tag', text: '⏱ ' + room.minutes + ' min' }),
          el('span', { class: 'tag', text: '❓ ' + roomQuestionCount(room) + ' vragen' }),
          el('span', { class: 'tag', text: '🎯 +' + roomMaxXP(room) + ' XP' }),
        ]),
      ]),
    ]));

    if (room.objectives && room.objectives.length) {
      view.append(el('div', { class: 'objectives' }, [
        el('h3', { text: '🎯 Wat je na deze room kunt' }),
        el('ul', {}, room.objectives.map((o) => el('li', { text: o }))),
      ]));
    }

    const layout = el('div', { class: 'roomlayout' });
    const nav = el('nav', { class: 'tasknav' });
    const ol = el('ol');
    (room.tasks || []).forEach((t, ti) => {
      const li = el('li', { 'data-ti': ti, onclick: () => { const node = $('#task-' + ti); if (node) node.scrollIntoView({ behavior: 'smooth' }); } }, [
        el('span', { class: 'chk', text: taskComplete(room, ti) ? '✓' : '' }),
        el('span', { text: t.title }),
      ]);
      if (taskComplete(room, ti)) li.classList.add('complete');
      ol.append(li);
    });
    nav.append(ol);
    layout.append(nav);

    const content = el('div', {});
    (room.tasks || []).forEach((t, ti) => content.append(renderTask(room, t, ti)));

    // terms / resources
    if (room.terms && room.terms.length) {
      content.append(el('div', { class: 'task glossary' }, [
        el('h2', { text: '📖 Begrippenlijst' }),
        el('dl', {}, room.terms.flatMap((t) => [el('dt', { text: t.term }), el('dd', { text: t.def })])),
      ]));
    }
    if (room.resources && room.resources.length) {
      content.append(el('div', { class: 'task' }, [
        el('h2', { text: '🔗 Verder oefenen' }),
        el('ul', {}, room.resources.map((r) => el('li', {}, el('a', { href: r.url, target: '_blank', rel: 'noopener', text: r.title })))),
      ]));
    }

    // navigatie onderaan
    const all = orderedRooms();
    const pos = all.findIndex((r) => r.id === room.id);
    content.append(el('div', { class: 'room-foot' }, [
      pos > 0 ? el('button', { class: 'btn', text: '← ' + all[pos - 1].title, onclick: () => go('#/room/' + all[pos - 1].id) }) : el('span', {}),
      pos < all.length - 1 ? el('button', { class: 'btn primary', text: all[pos + 1].title + ' →', onclick: () => go('#/room/' + all[pos + 1].id) }) : el('button', { class: 'btn primary', text: '🏁 Naar overzicht', onclick: () => go('#/') }),
    ]));

    layout.append(content);
    view.append(layout);
    root.append(view);
    renderFooter(root);
    window.scrollTo(0, 0);
  }

  function roomMaxXP(room) {
    let xp = 0;
    (room.tasks || []).forEach((t) => (t.questions || []).forEach((q) => { xp += qXP(q); }));
    return xp;
  }
  function qXP(q) { return q.xp != null ? q.xp : (q.noAnswer ? 2 : (Array.isArray(q.options) ? 5 : 10)); }
  function taskComplete(room, ti) {
    const t = room.tasks[ti];
    if (!t.questions || !t.questions.length) return true;
    return t.questions.every((q, qi) => isAnswered(room.id, ti, qi));
  }

  function renderTask(room, task, ti) {
    const node = el('div', { class: 'task', id: 'task-' + ti });
    node.append(el('h2', {}, [document.createTextNode(task.title)]));
    node.append(el('div', { class: 'body', html: task.content || '' }));

    if (task.lab) {
      const labBox = el('div', {});
      node.append(labBox);
      const renderer = CS.labs[task.lab.type];
      if (renderer) { try { renderer(labBox, task.lab, { room, ti }); } catch (e) { labBox.append(el('div', { class: 'callout danger', text: 'Lab kon niet laden: ' + e.message })); console.error(e); } }
      else labBox.append(el('div', { class: 'callout warn', text: 'Onbekend labtype: ' + task.lab.type }));
    }

    if (task.questions && task.questions.length) {
      const qwrap = el('div', { class: 'questions' });
      qwrap.append(el('h3', { text: '❓ Vragen beantwoorden' }));
      task.questions.forEach((q, qi) => qwrap.append(renderQuestion(room, task, ti, q, qi)));
      node.append(qwrap);
    }
    return node;
  }

  function markAnswered(room, ti, qi, q, qNode) {
    const key = qKey(room.id, ti, qi);
    if (STATE.answered[key]) return;
    STATE.answered[key] = true;
    // vlaggen tellen
    const ansFirst = Array.isArray(q.answer) ? q.answer[0] : q.answer;
    if (typeof ansFirst === 'string' && /^JVT\{/.test(ansFirst)) { STATE.flags = (STATE.flags || 0) + 1; }
    saveState();
    addXP(qXP(q), 'vraag');
    updateTaskNav(room);
    // room af?
    if (roomDone(room)) {
      toast('✅ Room voltooid!', room.title);
    }
    checkBadges();
  }

  function updateTaskNav(room) {
    $$('.tasknav li').forEach((li) => {
      const ti = +li.getAttribute('data-ti');
      const done = taskComplete(room, ti);
      li.classList.toggle('complete', done);
      $('.chk', li).textContent = done ? '✓' : '';
    });
  }

  function renderQuestion(room, task, ti, q, qi) {
    const already = isAnswered(room.id, ti, qi);
    const node = el('div', { class: 'q' + (already ? ' correct' : '') });
    const qtext = el('div', { class: 'qtext', html: esc(q.q) });
    qtext.append(el('span', { class: 'badge-xp', text: '+' + qXP(q) + ' XP' }));
    node.append(qtext);

    const feedback = el('div', { class: 'feedback' });
    const explainBox = q.explain ? el('div', { class: 'explain' + (already ? ' show' : ''), html: esc(q.explain) }) : null;

    if (q.noAnswer) {
      // bevestigen
      const btn = el('button', { class: 'btn small' + (already ? ' ' : ' primary'), text: already ? '✓ Gelezen' : 'Markeer als gelezen', disabled: already, onclick: () => {
        markAnswered(room, ti, qi, q, node); node.classList.add('correct'); btn.textContent = '✓ Gelezen'; btn.disabled = true; btn.classList.remove('primary');
      } });
      node.append(btn);
    } else if (Array.isArray(q.options)) {
      const mc = el('div', { class: 'mc' });
      q.options.forEach((opt, oi) => {
        const b = el('button', { html: esc(opt), disabled: already });
        if (already && oi === q.answer) b.classList.add('reveal-ok');
        b.addEventListener('click', () => {
          if (isAnswered(room.id, ti, qi)) return;
          const ok = oi === q.answer;
          b.classList.add('chosen', ok ? 'ok' : 'no');
          if (ok) {
            $$('button', mc).forEach((x) => { x.disabled = true; });
            feedback.textContent = '✓ Goed!'; feedback.className = 'feedback show ok';
            if (explainBox) explainBox.classList.add('show');
            markAnswered(room, ti, qi, q, node); node.classList.add('correct');
          } else {
            feedback.textContent = '✗ Niet helemaal. Probeer nog eens.'; feedback.className = 'feedback show no';
            setTimeout(() => { b.classList.remove('chosen', 'no'); }, 900);
          }
        });
        mc.append(b);
      });
      node.append(mc);
    } else {
      // open antwoord
      const answers = (Array.isArray(q.answer) ? q.answer : [q.answer]).map((a) => String(a));
      const placeholder = answers[0].replace(/[^\s]/g, '•').slice(0, 24) || 'antwoord…';
      const input = el('input', { type: 'text', placeholder: already ? answers[0] : placeholder, value: already ? answers[0] : '', disabled: already, autocomplete: 'off', spellcheck: 'false' });
      if (already) input.classList.add('ok');
      const submit = el('button', { class: 'btn small primary', text: already ? '✓' : 'Controleer', disabled: already });
      const check = () => {
        if (isAnswered(room.id, ti, qi)) return;
        const val = norm(input.value).toLowerCase();
        if (!val) return;
        const ok = answers.some((a) => norm(a).toLowerCase() === val);
        if (ok) {
          input.classList.add('ok'); input.classList.remove('no'); input.disabled = true; submit.textContent = '✓'; submit.disabled = true;
          feedback.textContent = '✓ Correct!'; feedback.className = 'feedback show ok';
          if (explainBox) explainBox.classList.add('show');
          markAnswered(room, ti, qi, q, node); node.classList.add('correct');
        } else {
          input.classList.add('no');
          feedback.textContent = '✗ Nog niet goed. Lees de uitleg of vraag een hint.'; feedback.className = 'feedback show no';
          setTimeout(() => input.classList.remove('no'), 900);
        }
      };
      submit.addEventListener('click', check);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
      node.append(el('div', { class: 'ans-row' }, [input, submit]));

      if (q.hint) {
        const hintLine = el('div', { class: 'hintline', text: '💡 ' + q.hint });
        const hintBtn = el('button', { class: 'lnk', text: 'Hint', onclick: () => { hintLine.classList.toggle('show'); } });
        node.append(el('div', { style: 'margin-top:6px' }, hintBtn));
        node.append(hintLine);
      }
    }
    node.append(feedback);
    if (explainBox) node.append(explainBox);
    return node;
  }

  // =======================================================================
  //  Zoeken
  // =======================================================================
  let searchPanel;
  function onSearch(e) {
    const q = norm(($('#searchInput') || {}).value || '').toLowerCase();
    if (searchPanel) { searchPanel.remove(); searchPanel = null; }
    if (q.length < 2) return;
    const hits = [];
    ROOMS.forEach((r) => {
      const hay = (r.title + ' ' + r.summary + ' ' + (r.objectives || []).join(' ') + ' ' + (r.terms || []).map((t) => t.term + ' ' + t.def).join(' ') + ' ' + (r.tasks || []).map((t) => t.title + ' ' + (t.content || '')).join(' ')).toLowerCase();
      if (hay.includes(q)) hits.push(r);
    });
    searchPanel = el('div', { class: 'searchres' }, el('div', { class: 'panel' },
      hits.length ? hits.slice(0, 8).map((r) => el('div', { class: 'item', onclick: () => { go('#/room/' + r.id); if (searchPanel) { searchPanel.remove(); searchPanel = null; } $('#searchInput').value = ''; } }, [
        el('span', { class: 'ic', text: r.icon }),
        el('div', {}, [el('div', { class: 't', text: r.title }), el('div', { class: 's', text: r.summary })]),
      ])) : el('div', { class: 'empty', text: 'Niets gevonden voor "' + q + '".' })
    ));
    document.body.append(searchPanel);
  }
  document.addEventListener('click', (e) => {
    if (searchPanel && !searchPanel.contains(e.target) && !e.target.closest('.search')) { searchPanel.remove(); searchPanel = null; }
  });

  // =======================================================================
  //  Modals: badges & profiel
  // =======================================================================
  function modal(title, bodyNode) {
    const back = el('div', { class: 'modal-back', onclick: (e) => { if (e.target === back) back.remove(); } });
    const m = el('div', { class: 'modal' });
    m.append(el('button', { class: 'iconbtn close', text: '✕', onclick: () => back.remove() }));
    m.append(el('h2', { text: title }));
    m.append(bodyNode);
    back.append(m);
    document.body.append(back);
    return back;
  }
  function showBadges() {
    const grid = el('div', { class: 'badge-grid' });
    BADGES.forEach((b) => {
      const got = !!STATE.badges[b.id];
      grid.append(el('div', { class: 'badge-item' + (got ? '' : ' locked') }, [
        el('div', { class: 'bi', text: b.icon }),
        el('div', { class: 'bn', text: b.name }),
        el('div', { class: 'bd', text: b.desc }),
      ]));
    });
    const got = Object.keys(STATE.badges).length;
    modal('🏅 Badges (' + got + '/' + BADGES.length + ')', grid);
  }
  function showProfile() {
    const L = levelFor(STATE.xp);
    const doneRooms = ROOMS.filter(roomDone).length;
    const body = el('div', {});
    body.append(el('p', { html: '<strong>Level ' + L.lvl + '</strong> · ' + STATE.xp + ' XP totaal' }));
    body.append(el('div', { class: 'meter' }, el('i', { style: 'width:' + Math.round((L.into / L.need) * 100) + '%;background:linear-gradient(90deg,var(--accent),var(--accent-2))' })));
    body.append(el('p', { class: 'found-note', text: L.into + ' / ' + L.need + ' XP tot level ' + (L.lvl + 1) }));
    body.append(el('ul', {}, [
      el('li', { text: doneRooms + ' van ' + ROOMS.length + ' rooms voltooid' }),
      el('li', { text: Object.keys(STATE.answered).length + ' vragen beantwoord' }),
      el('li', { text: (STATE.flags || 0) + ' vlaggen gevonden' }),
      el('li', { text: Object.keys(STATE.badges).length + ' van ' + BADGES.length + ' badges' }),
    ]));
    body.append(el('hr', { style: 'border:0;border-top:1px solid var(--border);margin:16px 0' }));
    body.append(el('button', { class: 'btn', text: '↺ Voortgang wissen', onclick: () => {
      if (confirm('Weet je het zeker? Al je voortgang, XP en badges worden gewist.')) {
        STATE = { answered: {}, xp: 0, badges: {}, flags: 0 }; saveState(); renderXP();
        document.querySelector('.modal-back').remove(); route();
      }
    } }));
    modal('👤 Jouw voortgang', body);
  }

  // =======================================================================
  //  Footer + router
  // =======================================================================
  function renderFooter(root) {
    root.append(el('footer', { class: 'sitefoot' }, el('div', { class: 'wrap' }, [
      el('div', { html: 'JVT Cyber Dojo · gemaakt om doelgericht te leren · <em>oefen aanvalstechnieken alleen in je eigen lab of met schriftelijke toestemming</em>' }),
      el('div', { text: 'Voortgang wordt lokaal in je browser bewaard.' }),
    ])));
  }

  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  CS.go = go;
  function route() {
    const h = location.hash || '#/';
    const m = h.match(/^#\/room\/(.+)$/);
    if (m) renderRoom(decodeURIComponent(m[1]));
    else renderHome();
  }
  window.addEventListener('hashchange', route);

  // ---- Boot --------------------------------------------------------------
  CS.boot = function boot() {
    initTheme();
    ROOMS.sort((a, b) => {
      const pa = PATHS.findIndex((p) => p.id === a.path), pb = PATHS.findIndex((p) => p.id === b.path);
      return pa - pb || a.order - b.order;
    });
    renderTopbar();
    route();
  };
})();

</script>
<script>
/* ======================================================================
   JVT Cyber Dojo — interactieve labs
   Elke lab registreert zich via CS.registerLab(type, fn).
   fn(container, labConfig, ctx) bouwt de UI in container.
   ====================================================================== */
(function () {
  'use strict';
  const { el, esc } = CS.util;

  function shell(title, bodyNode, dots = true) {
    const box = el('div', { class: 'lab' });
    const head = el('div', { class: 'lab-head' });
    if (dots) head.append(el('span', { class: 'dot r' }), el('span', { class: 'dot y' }), el('span', { class: 'dot g' }));
    head.append(el('span', { class: 'title', html: title }));
    box.append(head, el('div', { class: 'lab-body' }, bodyNode));
    return box;
  }

  // small sync hashers (voor hashcrack & cyberchef) ----------------------
  const Hash = {
    md5: md5, sha1: sha1, sha256: sha256,
  };

  // =====================================================================
  //  TERMINAL
  // =====================================================================
  CS.registerLab('terminal', function (container, cfg) {
    const isPwsh = cfg.shell === 'powershell';
    const user = cfg.user || 'student';
    const host = cfg.host || 'jvt-lab';
    const home = cfg.home || '/home/' + user;
    let cwd = cfg.cwd || home;
    const denied = new Set(cfg.denied || []);
    const fixed = {};
    Object.keys(cfg.commands || {}).forEach((k) => { fixed[normCmd(k)] = cfg.commands[k]; });

    // bouw bestandssysteem
    const files = {}; // pad -> inhoud (string) ; mappen als pad eindigend op niets, bijgehouden in dirs
    const dirs = new Set(['/']);
    const modes = cfg.modes || {};
    const owners = cfg.owners || {};
    for (const [p, v] of Object.entries(cfg.fs || {})) {
      const isDir = p.endsWith('/') && (v === null || v === undefined);
      const clean = isDir ? p.slice(0, -1) : p;
      const parts = clean.split('/').filter(Boolean);
      for (let i = 1; i < parts.length; i++) dirs.add('/' + parts.slice(0, i).join('/'));
      if (isDir) dirs.add('/' + parts.join('/'));
      else files[clean] = v == null ? '' : String(v);
    }
    // zorg dat home/cwd bestaan
    [home, cwd].forEach((d) => { const parts = d.split('/').filter(Boolean); for (let i = 1; i <= parts.length; i++) dirs.add('/' + parts.slice(0, i).join('/')); });

    const out = el('div', { class: 'term', tabindex: '0' });
    const history = [];
    let hidx = 0;

    function resolve(p) {
      if (!p) return cwd;
      p = p.replace('~', home);
      let base = p.startsWith('/') ? [] : cwd.split('/').filter(Boolean);
      p.split('/').forEach((seg) => {
        if (seg === '' || seg === '.') return;
        if (seg === '..') base.pop();
        else base.push(seg);
      });
      return '/' + base.join('/');
    }
    const exists = (p) => files.hasOwnProperty(p) || dirs.has(p);
    const isDenied = (p) => { for (const d of denied) { if (p === d || p.startsWith(d + '/')) return true; } return false; };
    const childrenOf = (dir) => {
      const set = new Set();
      const pre = dir === '/' ? '/' : dir + '/';
      [...Object.keys(files), ...dirs].forEach((p) => {
        if (p === dir) return;
        if (p.startsWith(pre)) { const rest = p.slice(pre.length).split('/')[0]; if (rest) set.add(rest); }
      });
      return [...set].sort();
    };

    function println(text, cls) {
      const line = el('div', { class: 'line' + (cls ? ' ' + cls : '') });
      line.textContent = text;
      out.append(line);
      out.scrollTop = out.scrollHeight;
    }
    function printPrompted(cmd) {
      const line = el('div', { class: 'line' });
      line.append(el('span', { class: 'prompt', text: promptStr() }), document.createTextNode(' ' + cmd));
      out.append(line);
    }
    function promptStr() {
      if (isPwsh) return 'PS ' + cwd.replace(home, '~') + '>';
      return user + '@' + host + ':' + cwd.replace(home, '~') + '$';
    }

    function run(raw) {
      const cmd = raw.trim();
      if (!cmd) return;
      history.push(cmd); hidx = history.length;
      // vaste commando's eerst
      const fx = fixed[normCmd(cmd)];
      if (fx !== undefined) { println(fx); return; }
      if (isPwsh) {
        if (/^(clear|cls)$/i.test(cmd)) { out.innerHTML = ''; return; }
        if (/^help$/i.test(cmd)) { println('Beschikbare commando\'s in dit lab zijn vooraf ingesteld. Typ de commando\'s uit de opdracht precies over.'); return; }
        if (/^history$/i.test(cmd)) { history.forEach((h, i) => println('  ' + (i + 1) + '  ' + h)); return; }
        println("De term '" + cmd.split(' ')[0] + "' wordt niet herkend. Typ de commando's uit de opdracht precies over.", 'err');
        return;
      }
      // pipes
      const stages = cmd.split('|').map((s) => s.trim());
      let input = null; // null = geen stdin
      let errored = false;
      for (let i = 0; i < stages.length; i++) {
        const res = execBash(stages[i], input, i > 0);
        if (res.err) { println(res.err, 'err'); errored = true; break; }
        input = res.out; // string of array? we gebruiken string met \n
      }
      if (!errored && input != null && input !== '') println(input.replace(/\n$/, ''));
    }

    function execBash(segment, stdin, piped) {
      const toks = tokenize(segment);
      if (!toks.length) return { out: stdin || '' };
      const c = toks[0];
      const args = toks.slice(1);
      const flags = args.filter((a) => a.startsWith('-') && a !== '-');
      const rest = args.filter((a) => !a.startsWith('-') || a === '-');
      const hasFlag = (f) => flags.some((x) => x === f || (x.length > 1 && !x.startsWith('--') && x.slice(1).includes(f.replace('-', ''))));

      const readFile = (p) => {
        const abs = resolve(p);
        if (isDenied(abs)) return { err: 'cat: ' + p + ': Permission denied' };
        if (dirs.has(abs) && !files.hasOwnProperty(abs)) return { err: 'cat: ' + p + ': Is a directory' };
        if (!files.hasOwnProperty(abs)) return { err: 'cat: ' + p + ': No such file or directory' };
        return { out: files[abs] };
      };

      switch (c) {
        case 'help':
          return { out: 'Beschikbare commando\'s:\n  ls, cd, pwd, cat, head, tail, grep, find, echo, whoami, id,\n  hostname, uname, history, clear, wc, file, sort, uniq, cut,\n  base64, sha256sum, md5sum, touch, mkdir, rm, strings\nPipes met | werken. Typ de commando\'s uit de opdracht.' };
        case 'pwd': return { out: cwd };
        case 'whoami': return { out: user };
        case 'id': return { out: 'uid=1000(' + user + ') gid=1000(' + user + ') groups=1000(' + user + ')' };
        case 'hostname': return { out: host };
        case 'uname': return { out: hasFlag('-a') ? 'Linux ' + host + ' 6.1.0-jvt #1 SMP x86_64 GNU/Linux' : 'Linux' };
        case 'clear': out.innerHTML = ''; return { out: '' };
        case 'echo': return { out: args.join(' ').replace(/^["']|["']$/g, '') };
        case 'history': return { out: history.map((h, i) => '  ' + (i + 1) + '  ' + h).join('\n') };
        case 'cd': {
          const target = rest[0] ? resolve(rest[0]) : home;
          if (isDenied(target)) return { err: 'cd: ' + rest[0] + ': Permission denied' };
          if (dirs.has(target)) { cwd = target; return { out: '' }; }
          if (files.hasOwnProperty(target)) return { err: 'cd: ' + rest[0] + ': Not a directory' };
          return { err: 'cd: ' + (rest[0] || '') + ': No such file or directory' };
        }
        case 'ls': {
          const dir = resolve(rest[0] || '.');
          if (isDenied(dir)) return { err: 'ls: cannot open directory \'' + (rest[0] || '.') + '\': Permission denied' };
          if (files.hasOwnProperty(dir) && !dirs.has(dir)) return { out: rest[0] };
          if (!dirs.has(dir)) return { err: 'ls: cannot access \'' + (rest[0] || '') + '\': No such file or directory' };
          let names = childrenOf(dir);
          if (!hasFlag('-a')) names = names.filter((n) => !n.startsWith('.'));
          else names = ['.', '..', ...names];
          if (hasFlag('-l')) {
            const lines = names.map((n) => {
              if (n === '.' || n === '..') return 'drwxr-xr-x 1 ' + user + ' ' + user + ' 4096 okt  3 10:00 ' + n;
              const full = dir === '/' ? '/' + n : dir + '/' + n;
              const isD = dirs.has(full) && !files.hasOwnProperty(full);
              const mode = modes[full] || (isD ? 'drwxr-xr-x' : '-rw-r--r--');
              const owner = owners[full] || user;
              const size = isD ? 4096 : (files[full] || '').length;
              return mode + ' 1 ' + owner + ' ' + owner + ' ' + String(size).padStart(5) + ' okt  3 10:00 ' + n;
            });
            return { out: lines.join('\n') };
          }
          return { out: names.join('  ') };
        }
        case 'cat': {
          if (stdin != null && !rest.length) return { out: stdin };
          if (!rest.length) return { out: '' };
          let acc = [];
          for (const f of rest) { const r = readFile(f); if (r.err) return r; acc.push(r.out); }
          return { out: acc.join('') };
        }
        case 'head': case 'tail': {
          let n = 10; const ni = args.indexOf('-n'); if (ni >= 0 && args[ni + 1]) n = parseInt(args[ni + 1], 10) || 10;
          let text = stdin;
          if (rest.length) { const r = readFile(rest[rest.length - 1]); if (r.err) return r; text = r.out; }
          const lines = (text || '').replace(/\n$/, '').split('\n');
          return { out: (c === 'head' ? lines.slice(0, n) : lines.slice(-n)).join('\n') };
        }
        case 'wc': {
          let text = stdin;
          if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; }
          const t = text || '';
          const lines = t === '' ? 0 : t.replace(/\n$/, '').split('\n').length;
          if (hasFlag('-l')) return { out: String(lines) };
          const words = t.trim() ? t.trim().split(/\s+/).length : 0;
          return { out: '  ' + lines + '  ' + words + '  ' + t.length + (rest[0] ? ' ' + rest[0] : '') };
        }
        case 'grep': {
          const invert = hasFlag('-v'), ic = hasFlag('-i'), nums = hasFlag('-n'), count = hasFlag('-c'), rec = hasFlag('-r');
          const nonFlag = rest;
          const pattern = nonFlag[0];
          if (pattern == null) return { err: 'usage: grep [-ivnc] patroon [bestand]' };
          let source = [];
          if (rec && nonFlag[1]) {
            const base = resolve(nonFlag[1]);
            Object.keys(files).forEach((p) => { if (p === base || p.startsWith(base + '/')) files[p].replace(/\n$/, '').split('\n').forEach((ln, i) => source.push({ ln, i, file: p })); });
          } else if (stdin != null && nonFlag.length < 2) {
            (stdin || '').replace(/\n$/, '').split('\n').forEach((ln, i) => source.push({ ln, i }));
          } else {
            for (let fi = 1; fi < nonFlag.length; fi++) { const r = readFile(nonFlag[fi]); if (r.err) return r; r.out.replace(/\n$/, '').split('\n').forEach((ln, i) => source.push({ ln, i, file: nonFlag.length > 2 || rec ? nonFlag[fi] : null })); }
          }
          let re; try { re = new RegExp(pattern.replace(/^["']|["']$/g, ''), ic ? 'i' : ''); } catch (e) { return { err: 'grep: ongeldig patroon' }; }
          let matched = source.filter((s) => re.test(s.ln));
          if (invert) matched = source.filter((s) => !re.test(s.ln));
          if (count) return { out: String(matched.length) };
          return { out: matched.map((s) => (s.file ? s.file + ':' : '') + (nums ? (s.i + 1) + ':' : '') + s.ln).join('\n') };
        }
        case 'find': {
          const base = resolve(rest[0] || '.');
          const ni = args.indexOf('-name'); const namePat = ni >= 0 ? args[ni + 1].replace(/^["']|["']$/g, '') : null;
          const ti = args.indexOf('-type'); const type = ti >= 0 ? args[ti + 1] : null;
          const re = namePat ? new RegExp('^' + namePat.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$') : null;
          const all = [...dirs, ...Object.keys(files)].filter((p) => p === base || p.startsWith(base === '/' ? '/' : base + '/'));
          const res = all.filter((p) => {
            if (isDenied(p)) return false;
            if (type === 'f' && !files.hasOwnProperty(p)) return false;
            if (type === 'd' && files.hasOwnProperty(p)) return false;
            if (re) { const name = p.split('/').pop(); return re.test(name); }
            return true;
          }).sort();
          return { out: res.join('\n') };
        }
        case 'sort': {
          let text = stdin; if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; }
          let lines = (text || '').replace(/\n$/, '').split('\n');
          if (hasFlag('-n')) lines.sort((a, b) => parseFloat(a) - parseFloat(b)); else lines.sort();
          if (hasFlag('-r')) lines.reverse();
          return { out: lines.join('\n') };
        }
        case 'uniq': {
          let text = stdin; if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; }
          const lines = (text || '').replace(/\n$/, '').split('\n');
          const res = []; let prev = Symbol(), cnt = 0;
          lines.forEach((l) => { if (l === prev) cnt++; else { if (cnt) res.push(hasFlag('-c') ? String(cnt).padStart(7) + ' ' + prev : prev); prev = l; cnt = 1; } });
          if (cnt) res.push(hasFlag('-c') ? String(cnt).padStart(7) + ' ' + prev : prev);
          return { out: res.join('\n') };
        }
        case 'cut': {
          const di = args.indexOf('-d'); const delim = di >= 0 ? args[di + 1].replace(/^["']|["']$/g, '') : '\t';
          const fi = args.indexOf('-f'); const field = fi >= 0 ? parseInt(args[fi + 1], 10) : 1;
          let text = stdin; const file = rest.find((r, i) => i > 0 || !['-d', '-f'].includes(r));
          const fname = rest[rest.length - 1]; if (rest.length && files.hasOwnProperty(resolve(fname))) { const r = readFile(fname); if (r.err) return r; text = r.out; }
          const lines = (text || '').replace(/\n$/, '').split('\n').map((l) => (l.split(delim)[field - 1] || ''));
          return { out: lines.join('\n') };
        }
        case 'base64': {
          let text = stdin; if (rest.length) { const r = readFile(rest[rest.length - 1]); if (r.err) return r; text = r.out; }
          try { return { out: hasFlag('-d') ? b64decode((text || '').trim()) : b64encode(text || '') }; } catch (e) { return { err: 'base64: ongeldige invoer' }; }
        }
        case 'sha256sum': { let text = stdin; if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; } return { out: sha256(text || '') + '  ' + (rest[0] || '-') }; }
        case 'md5sum': { let text = stdin; if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; } return { out: md5(text || '') + '  ' + (rest[0] || '-') }; }
        case 'strings': {
          let text = stdin; if (rest.length) { const r = readFile(rest[0]); if (r.err) return r; text = r.out; }
          const m = (text || '').match(/[\x20-\x7e]{4,}/g) || [];
          return { out: m.join('\n') };
        }
        case 'file': {
          const abs = resolve(rest[0]); if (!exists(abs)) return { err: 'file: ' + rest[0] + ': No such file or directory' };
          if (dirs.has(abs) && !files.hasOwnProperty(abs)) return { out: rest[0] + ': directory' };
          const content = files[abs] || '';
          return { out: rest[0] + ': ' + (/[^\x09-\x7e]/.test(content) ? 'data' : 'ASCII text') };
        }
        case 'touch': { const abs = resolve(rest[0]); if (!files.hasOwnProperty(abs)) { files[abs] = ''; const parts = abs.split('/').filter(Boolean); for (let i = 1; i < parts.length; i++) dirs.add('/' + parts.slice(0, i).join('/')); } return { out: '' }; }
        case 'mkdir': { const abs = resolve(rest[0]); dirs.add(abs); const parts = abs.split('/').filter(Boolean); for (let i = 1; i < parts.length; i++) dirs.add('/' + parts.slice(0, i).join('/')); return { out: '' }; }
        case 'rm': { const abs = resolve(rest[rest.length - 1]); if (files.hasOwnProperty(abs)) { delete files[abs]; return { out: '' }; } if (dirs.has(abs)) { if (hasFlag('-r')) { dirs.delete(abs); Object.keys(files).forEach((p) => { if (p.startsWith(abs + '/')) delete files[p]; }); return { out: '' }; } return { err: 'rm: cannot remove \'' + rest[rest.length - 1] + '\': Is a directory' }; } return { err: 'rm: cannot remove \'' + rest[rest.length - 1] + '\': No such file or directory' }; }
        default:
          return { err: (piped ? '' : 'bash: ') + c + ': command not found' };
      }
    }

    // invoerregel
    function newPrompt() {

  CS.registerLab('password', function (container) {
    const wrap = el('div', { class: 'lab-pad' });
    wrap.append(el('label', { text: 'Typ een wachtwoord (wordt NIET verstuurd — alles blijft in je browser)' }));
    const inp = el('input', { type: 'text', placeholder: 'probeer eens iets…', spellcheck: 'false' });
    wrap.append(inp);
    const meter = el('div', { class: 'meter' }, el('i', { style: 'width:0%' }));
    wrap.append(meter);
    const verdict = el('div', { class: 'found-note' });
    const info = el('div', { class: 'lab-out', style: 'margin-top:8px' });
    wrap.append(verdict, info);
    const COMMON = new Set(['wachtwoord', 'password', '123456', '123456789', 'welkom', 'welkom01', 'qwerty', 'geheim', 'admin', 'letmein', 'iloveyou', 'voetbal', 'lente2024', 'zomer2025']);

    function analyse(pw) {
      let pool = 0;
      if (/[a-z]/.test(pw)) pool += 26;
      if (/[A-Z]/.test(pw)) pool += 26;
      if (/[0-9]/.test(pw)) pool += 10;
      if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
      const entropy = pw.length ? Math.round(pw.length * Math.log2(pool || 1)) : 0;
      const guesses = Math.pow(2, entropy);
      const perSec = 1e10; // 10 miljard/sec (moderne GPU, offline)
      const secs = guesses / perSec;
      return { entropy, secs, common: COMMON.has(pw.toLowerCase()) };
    }
    function human(secs) {
      if (secs < 1) return 'minder dan een seconde';
      const u = [['jaar', 31536000], ['dag', 86400], ['uur', 3600], ['minuut', 60], ['seconde', 1]];
      for (const [n, s] of u) { if (secs >= s) { const v = secs / s; if (v > 1e9) return Math.round(v / 1e9) + ' miljard ' + n + 'en'; if (v > 1e6) return Math.round(v / 1e6) + ' miljoen ' + n + 'en'; return Math.round(v) + ' ' + n + (Math.round(v) === 1 ? '' : (n === 'jaar' ? ' jaar' : 'en')); } }
      return '—';
    }
    inp.addEventListener('input', () => {
      const pw = inp.value; const a = analyse(pw);
      const pct = Math.min(100, (a.entropy / 90) * 100);
      const bar = meter.querySelector('i');
      bar.style.width = pct + '%';
      let color = 'var(--bad)', label = 'zeer zwak';
      if (a.common) { color = 'var(--bad)'; label = 'staat in elke woordenlijst!'; bar.style.width = '8%'; }
      else if (a.entropy >= 70) { color = 'var(--good)'; label = 'sterk'; }
      else if (a.entropy >= 50) { color = 'var(--warn)'; label = 'redelijk'; }
      else if (a.entropy >= 30) { color = 'var(--warn)'; label = 'zwak'; }
      bar.style.background = color;
      verdict.innerHTML = '<strong style="color:' + color + '">' + label + '</strong> · ' + a.entropy + ' bits entropie';
      info.textContent = pw ? 'Geschatte kraaktijd (offline, 10 miljard pogingen/sec): ' + (a.common ? 'direct — dit wachtwoord wordt als eerste geprobeerd' : human(a.secs)) : '';
    });
    container.append(shell('<b>Wachtwoord-analyse</b>', wrap, false));
  });

        <p>Computers kennen maar twee toestanden: aan (1) en uit (0). Dat is het <strong>binaire</strong> talstelsel.
        Een enkele 0 of 1 heet een <strong>bit</strong>. Acht bits samen heten een <strong>byte</strong> of, als het om
        een deel van een IP-adres gaat, een <strong>octet</strong>. Een IPv4-adres bestaat uit vier van die octetten,
        dus uit 4 &times; 8 = 32 bits.</p>

        <p>Om binair te lezen hoef je maar één tabel te kennen: de plaatswaarden binnen een octet. Van links naar rechts
        verdubbelt elke plaats:</p>

        <table>
          <thead>
            <tr><th>Plaats</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>

          </tbody>
        </table>

        <p><strong>Van binair naar decimaal:</strong> tel de waarden op waar een 1 staat. Voorbeeld:
        <code>11000000</code>. Er staat een 1 op plaats 1 (128) en plaats 2 (64), de rest is 0. Dus 128 + 64 = <strong>192</strong>.</p>

        <p><strong>Nog een voorbeeld:</strong> <code>10101000</code> = 128 + 32 + 8 = <strong>168</strong>. En
        <code>00000001</code> = <strong>1</strong>. Zo is <code>192.168.1.10</code> binair:
        <code>11000000.10101000.00000001.00001010</code>.</p>

        <p><strong>Van decimaal naar binair:</strong> werk van links (128) naar rechts. Past de plaatswaarde in je
        getal, zet dan een 1 en trek hem af; past hij niet, zet een 0. Voorbeeld 200:</p>
        <ul>
          <li>128 past in 200 &rarr; 1, rest 72</li>
          <li>64 past in 72 &rarr; 1, rest 8</li>

          <li>4 &rarr; 0; 2 &rarr; 0; 1 &rarr; 0</li>
        </ul>
        <p>Resultaat: 200 = <code>11001000</code>. Elk octet loopt zo van 0 (<code>00000000</code>) tot en met 255

        (welk apparaat binnen dat netwerk). Het <strong>subnetmasker</strong> vertelt waar de grens ligt. Op de plekken
        waar het masker een 1 heeft, hoort het bij het netwerkdeel; waar het een 0 heeft, bij het hostdeel.</p>

        <p>Het klassieke masker <code>255.255.255.0</code> is binair:</p>
        <p><code>11111111.11111111.11111111.00000000</code></p>
        <p>Dat zijn 24 enen gevolgd door 8 nullen. De eerste 24 bits zijn dus het netwerkdeel, de laatste 8 het

        <p>Omdat zo'n masker lang is, gebruiken we de <strong>CIDR-notatie</strong> (Classless Inter-Domain Routing):
        je telt simpelweg het aantal enen (netwerkbits) en zet dat achter het adres met een schuine streep. Dus
        <code>255.255.255.0</code> = <strong>/24</strong>. Het adres schrijf je dan als <code>192.168.1.0/24</code>.</p>
