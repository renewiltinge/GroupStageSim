services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: groupsim-sql
    env_file: .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "7272:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mssql_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: groupsim-rabbit
    env_file: .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tournament-api:
    build:
      context: .
      dockerfile: ./src/Tournament.Api/Dockerfile
    container_name: groupsim-api
    env_file: .env
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Default=${CONNECTIONSTRINGS__DEFAULT:-Server=sqlserver,1433;Database=GroupStageSim;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True}
      - Broker__HostName=${BROKER__HOSTNAME:-rabbitmq}
      - Broker__Port=${BROKER__PORT:-5672}
      - Broker__UserName=${BROKER__USERNAME:-${RABBITMQ_USER}}
      - Broker__Password=${BROKER__PASSWORD:-${RABBITMQ_PASSWORD}}
    ports:
      - "5180:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simulator-worker:
    build:
      context: .
      dockerfile: ./src/Simulator.Worker/Dockerfile
    container_name: groupsim-worker
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Default=${CONNECTIONSTRINGS__DEFAULT:-Server=sqlserver,1433;Database=GroupStageSim;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True}
      - Broker__HostName=${BROKER__HOSTNAME:-rabbitmq}
      - Broker__Port=${BROKER__PORT:-5672}
      - Broker__UserName=${BROKER__USERNAME:-${RABBITMQ_USER}}
      - Broker__Password=${BROKER__PASSWORD:-${RABBITMQ_PASSWORD}}
    restart: unless-stopped

volumes:
  mssql_data:
